description: 'Cholinergic interneuron control of intrastriatal GABAergic circuits
  targeting spiny projection neurons is disrupted in Parkinson’s disease modelsBelal,
  M.1, Perez-Rosello, T.1, Guven E. B.4, Xie, Z.1, Li, J. 3, Dauer, W.2, Tkatch, T.1,
  Assous, M.5, Tepper, J.M.4 , Clarke, V. R. J.1 , Surmeier, D. J.1Affiliation:1-Department
  of Neuroscience, Feinberg School of Medicine, Northwestern University, Chicago,
  IL USA2- Peter O’Donnell Jr. Brain Institute, Departments of Neurology and Neuroscience,
  University of Texas Southwestern Medical Center, Dallas, TX, USA.3 - Department
  of Internal Medicine, University of Michigan Medical School. Ann Arbor, MI, USA4-
  Molecular and Behavioral Neuroscience, Rutgers University, Newark, NJ USA5 - School
  of Biosciences, Cardiff University, Cardiff, UKParkinson’s disease (PD) is known
  to alter the intrinsic properties of striatal cholinergic interneurons (ChIs). However,
  how PD shapes ChI control of intrastriatal GABAergic circuits regulating principal
  spiny projection neurons (SPNs) is unknown. To fill this gap, striatal circuits
  in healthy and parkinsonian mice were interrogated. In ex vivo brain slices from
  healthy mice, optogenetic stimulation of ChIs evoked GABAA receptor currents in
  both indirect and direct pathway SPNs that were attributable to nicotinic acetylcholine
  receptor (nAChR)-mediated activation of GABAergic interneurons. Simulations suggested
  that this circuit exerts a state-dependent control of SPN dendritic integration
  that was modulated by concomitant muscarinic receptor signaling. Surprisingly, in
  mouse models of prodromal and parkinsonian states, the ability of ChIs to engage
  this intrastriatal circuitry was disrupted because interneurons down-regulated nicotinic
  AChRs. Taken together, these studies suggest that impaired ChI control of GABAergic
  interneurons contribute to behavioral deficits in both prodromal and clinical PD
  states. '
